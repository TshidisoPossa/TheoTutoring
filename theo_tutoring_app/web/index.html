<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="theo_tutoring_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>theo_tutoring_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    iPhone Safari: when a text box gets the keyboard, Safari pushes the whole
    page up to keep the box in view. Flutter already shrinks the app to the
    space above the keyboard, so that push is not needed, and after the
    keyboard closes Safari often leaves the page pushed up: the bottom of the
    screen (e.g. the page buttons under a table) is cut off and cannot be
    scrolled back. This puts the page back whenever the keyboard has closed.
  -->
  <script>
    (function () {
      function typing() {
        var el = document.activeElement;
        return !!el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' ||
          el.isContentEditable);
      }
      function putPageBack() {
        if (typing()) return; // keyboard still open
        if (window.scrollX !== 0 || window.scrollY !== 0) window.scrollTo(0, 0);
      }
      function soon() {
        // after the keyboard has finished closing
        setTimeout(putPageBack, 100);
        setTimeout(putPageBack, 400);
      }
      document.addEventListener('focusout', soon, true);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', soon);
      }
      window.addEventListener('orientationchange', soon);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
